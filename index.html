<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Expediente Clínico · ZMBV Asylum</title>
<link rel="icon" href="seal.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#dfe8e2; --paper:#fbfcfa; --field:#eef4f0; --ink:#14231e; --muted:#566862;
  --rule:#14231e; --line:#c3d1ca; --accent:#c6402c; --tint:#d3e7dc;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1a16; --paper:#16251f; --field:#0f1c17; --ink:#e8f0ec; --muted:#9bb0a8;
    --rule:#5f7d70; --line:#2b4038; --accent:#ff7b5f; --tint:#1f3a30; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);
  padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.folder{max-width:560px;margin-inline:auto;display:grid;gap:14px}
.ftab{display:flex;align-items:center;gap:12px;font:600 12px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ftab img{flex:none;width:52px;height:52px;border-radius:50%;background:#fff}
.sheet{background:var(--paper);border:1.5px solid var(--rule);border-radius:4px;padding:0 18px 22px;overflow:hidden;min-width:0}
.sheet::before{content:"";display:block;height:12px;margin-inline:-18px;margin-bottom:18px;background:var(--accent)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{margin:0;font:500 12px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stamp{flex:none;transform:rotate(-6deg);padding:5px 10px;border:2.5px solid var(--accent);border-radius:3px;color:var(--accent);font:700 13px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.idphoto{margin-top:14px;width:min(100%,220px);aspect-ratio:1;border:1.5px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--field)}
.idphoto img{display:block;width:100%;height:100%;object-fit:cover}
h1{margin:6px 0;font:700 clamp(46px,14vw,76px)/.92 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.pid{margin:0;font:500 13px/1.4 var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.lede{margin:10px 0 0;color:var(--muted)}
.facts{display:grid;margin:18px 0 0;border-top:1.5px solid var(--rule)}
.fact{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fact dt{font:600 11px/1.6 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact dd{margin:0;font-size:17px;overflow-wrap:anywhere}
.note{margin-top:18px;padding:12px 14px;background:var(--tint);border-radius:3px}
.note h2{margin:0 0 4px;font:600 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note p{margin:0;font-size:17px;overflow-wrap:anywhere}
.foot{margin:0;text-align:center;font:400 11px/1.5 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
@media (max-width:380px){.fact{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<main class="folder" id="app"></main>
<script>
(function(){
'use strict';
var app = document.getElementById('app');

function h(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function parseD(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function fLong(iso){
  var d = parseD(iso); if (!d) return '—';
  try { return d.toLocaleDateString('es-PR', { day:'numeric', month:'long', year:'numeric' }); }
  catch(e) { return iso; }
}
function daysText(iso){
  var d = parseD(iso); if (!d) return '—';
  var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  var n = Math.round((t - d) / 864e5);
  if (n < 0) return 'Ingresa en ' + (-n) + (n === -1 ? ' día' : ' días');
  if (n === 0) return 'Ingresó hoy';
  return n + (n === 1 ? ' día' : ' días');
}
function currentId(){
  var q = new URLSearchParams(location.search).get('id');
  return ((location.hash || '').slice(1) || q || '').trim().toLowerCase();
}
function top(hospital){
  var seal = h('img'); seal.src = 'seal.png'; seal.alt = '';
  var t = h('div', 'ftab'); t.append(seal, h('span', null, hospital || 'ZMBV Asylum'));
  return t;
}
function sheet(){ return h('article', 'sheet'); }

function renderMessage(hospital, title, text){
  app.textContent = '';
  var s = sheet(), hd = h('div', 'shead'); hd.append(h('p', 'eyebrow', 'Expediente clínico'));
  s.append(hd, h('h1', null, title), h('p', 'lede', text));
  app.append(top(hospital), s);
}
function renderPatient(data, p){
  app.textContent = '';
  var s = sheet(), hd = h('div', 'shead');
  hd.append(h('p', 'eyebrow', 'Expediente clínico'), h('span', 'stamp', 'Ingresado'));
  s.append(hd);
  if (p.photo) {
    var box = h('div', 'idphoto'), img = h('img'); img.src = p.photo; img.alt = 'Foto de ' + p.name;
    box.append(img); s.append(box);
  }
  s.append(h('h1', null, p.name), h('p', 'pid', 'ID-' + String(p.id).toUpperCase()));
  var facts = [['Fecha de ingreso', fLong(p.date)], ['Internamiento', daysText(p.date)]];
  if (p.room) facts.push(['Habitación', p.room]);
  if (p.dx) facts.push(['Diagnóstico', p.dx]);
  if (p.med) facts.push(['Medicación', p.med]);
  var dl = h('dl', 'facts');
  facts.forEach(function(f){ var r = h('div', 'fact'); r.append(h('dt', null, f[0]), h('dd', null, f[1])); dl.append(r); });
  s.append(dl);
  if (p.note) { var n = h('section', 'note'); n.append(h('h2', null, 'Notas del doctor'), h('p', null, p.note)); s.append(n); }
  app.append(top(data.hospital), s, h('p', 'foot', 'Expediente Confidencial · Archivos Clasificados'));
  document.title = p.name + ' · ' + (data.hospital || 'Expediente');
}

function load(){
  var id = currentId();
  if (!id) { renderMessage('', 'Escanea un brazalete', 'Apunta la cámara de tu teléfono al código QR del brazalete de un paciente para abrir su expediente.'); return; }
  fetch('patients.json', { cache:'no-cache' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      var p = (data.patients || []).filter(function(x){ return String(x.id).toLowerCase() === id; })[0];
      if (!p) renderMessage(data.hospital, 'Sin registro', 'Este código no coincide con ningún paciente. Pide al organizador que revise el brazalete.');
      else renderPatient(data, p);
    })
    .catch(function(){ renderMessage('', 'No disponible', 'No se pudo cargar el expediente. Revisa tu conexión e intenta de nuevo.'); });
}
window.addEventListener('hashchange', load);
load();
})();
</script>
</body>
</html>
